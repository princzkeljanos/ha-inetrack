name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit

      - name: Fail if a secret file is tracked
        run: |
          # These must never be committed (see .gitignore). Catch an accidental
          # "git add -f" before it reaches the public history.
          matches=$(git ls-files -- \
            '.inetrack_key' '*.key' '*.pem' '*.p12' '*.pfx' \
            'secrets.*' '.env' '.env.*' 'probe-output*.json' 'credentials*.json')
          if [ -n "$matches" ]; then
            echo "::error::Secret file(s) are tracked by git:"
            echo "$matches"
            exit 1
          fi
          echo "No secret files are tracked."

      - name: Run gitleaks
        env:
          VERSION: "8.30.1"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --no-banner
