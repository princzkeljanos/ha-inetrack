[project]
name = "ha-inetrack"
version = "0.1.0"
description = "Home Assistant custom integration for IneTrack GPS trackers"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "ASYNC",         # async pitfalls
    "RUF",           # ruff-specific
    "PL",            # pylint subset
]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
